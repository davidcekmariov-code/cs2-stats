<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CS2 Stats</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
        }

        /* HEADER */

        header {
            height: 70px;
            background: #111720;
            border-bottom: 1px solid #242c36;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #f5a623;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        /* MAIN */

        main {
            width: 86%;
            max-width: 1200px;
            margin: 40px auto;
        }

        /* SEARCH */

        .search-box {
            position: relative;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;

            padding: 15px;

            background: #151c25;
            border: 1px solid #29323e;
            border-radius: 8px;

            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #f5a623;
        }

        .search-box button {
            padding: 0 30px;

            background: #f5a623;
            color: #111;

            border: none;
            border-radius: 8px;

            font-weight: bold;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #ffb83d;
        }

        /* SEARCH RESULTS */

        #searchResults {
            background: #111720;
            border: 1px solid #242c36;
            border-radius: 8px;

            margin-bottom: 25px;

            overflow: hidden;

            display: none;
        }

        .search-player {
            padding: 13px 18px;
            cursor: pointer;
            border-bottom: 1px solid #242c36;
        }

        .search-player:hover {
            background: #1b232d;
        }

        .search-player:last-child {
            border-bottom: none;
        }

        /* PROFILE */

        .profile {
            background: #111720;
            border: 1px solid #242c36;
            border-radius: 12px;

            padding: 25px;

            display: flex;
            align-items: center;
            gap: 20px;

            margin-bottom: 25px;
        }

        .avatar {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            background: #f5a623;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #111;
            font-size: 30px;
            font-weight: bold;
        }

        .profile h1 {
            margin-bottom: 7px;
        }

        .profile p {
            color: #888;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: #111720;

            border: 1px solid #242c36;
            border-radius: 12px;

            padding: 22px;
        }

        .stat-card p {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-size: 28px;
        }

        /* CONTENT */

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #111720;

            border: 1px solid #242c36;
            border-radius: 12px;

            padding: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        /* MAPS */

        .map {
            margin-bottom: 20px;
        }

        .map-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 7px;
        }

        .map-header span:last-child {
            color: #f5a623;
        }

        .bar {
            height: 8px;

            background: #252d37;

            border-radius: 10px;

            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #f5a623;
        }

        /* GRAPH */

        .graph {
            height: 200px;

            display: flex;
            align-items: end;

            gap: 12px;

            padding-top: 20px;
        }

        .graph-bar {
            flex: 1;

            background: #f5a623;

            border-radius: 5px 5px 0 0;

            min-height: 20px;
        }

        /* FOOTER */

        footer {
            text-align: center;

            color: #666;

            padding: 30px;

            margin-top: 50px;

            border-top: 1px solid #242c36;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .content {
                grid-template-columns: 1fr;
            }

            nav {
                display: none;
            }

            .profile {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                padding: 14px;
            }
        }
    </style>
</head>

                <div class="bar">

            </div>


            <div class="map">

                <div class="bar">

        </div>


        <!-- ГРАФІК -->

        <div class="card">

            <div class="graph">

        </div>

    /* =================================

    ================================= */

    function showPlayer(player) {

        document.getElementById("playerName").textContent =
            player.name;

        document.getElementById("avatar").textContent =
            player.name.charAt(0).toUpperCase();

        document.getElementById("kd").textContent =
            player.kd;

        document.getElementById("kills").textContent =
            player.kills.toLocaleString();

        document.getElementById("deaths").textContent =
            player.deaths.toLocaleString();

        document.getElementById("winrate").textContent =
            player.winrate + "%";


        /* Трохи випадкової статистики карт
           для демонстрації */

        let mirage = Math.floor(Math.random() * 25) + 50;
        let dust = Math.floor(Math.random() * 25) + 45;
        let inferno = Math.floor(Math.random() * 25) + 45;
        let ancient = Math.floor(Math.random() * 25) + 40;


        document.getElementById("mirage").textContent =
            mirage + "%";

        document.getElementById("mirageBar").style.width =
            mirage + "%";


        document.getElementById("dust").textContent =
            dust + "%";

        document.getElementById("dustBar").style.width =
            dust + "%";


        document.getElementById("inferno").textContent =
            inferno + "%";

        document.getElementById("infernoBar").style.width =
            inferno + "%";


        document.getElementById("ancient").textContent =
            ancient + "%";

        document.getElementById("ancientBar").style.width =
            ancient + "%";


        document.getElementById("searchResults").style.display =
            "none";
    }


    /* =================================
       ПОШУК
    ================================= */

    function searchPlayer() {

        const input =
            document.getElementById("playerInput");

        const query =
            input.value.toLowerCase().trim();


        if (query === "") {

            alert("Введіть нікнейм!");

            return;
        }


        const player =
            players.find(
                p => p.name.toLowerCase() === query
            );


        if (player) {

            showPlayer(player);

        } else {

            alert("Гравця не знайдено!");

        }

    }


    /* =================================
       ПОКАЗУЄМО ПІДКАЗКИ ПРИ ВВЕДЕННІ
    ================================= */

    document
        .getElementById("playerInput")
        .addEventListener("input", function () {

            const query =
                this.value.toLowerCase().trim();

            const results =
                document.getElementById("searchResults");


            if (query === "") {

                results.style.display = "none";

                return;
            }


            const found =
                players.filter(
                    p =>
                    p.name
                    .toLowerCase()
                    .includes(query)
                );


            if (found.length === 0) {

                results.innerHTML =
                    `<div class="search-player">
                        Гравця не знайдено
                    </div>`;

                results.style.display = "block";

                return;
            }


            results.innerHTML = "";


            found.forEach(player => {

                const item =
                    document.createElement("div");

                item.className =
                    "search-player";

                item.textContent =
                    player.name;


                item.onclick = function () {

                    showPlayer(player);

                    document
                        .getElementById("playerInput")
                        .value = player.name;

                };


                results.appendChild(item);

            });


            results.style.display = "block";

        });

       ENTER ДЛЯ ПОШУКУ
    ================================= */

    document
        .getElementById("playerInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                searchPlayer();

            }
