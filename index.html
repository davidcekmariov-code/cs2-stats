<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Stats</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#f2f4f7;font:16px Arial,sans-serif}
header{background:#111720;border-bottom:1px solid #29323e;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:800;text-decoration:none;color:white}
.logo span,.accent{color:#f5a623}
nav{display:flex;gap:22px}
nav a{color:#b5bdc8;text-decoration:none}
nav a:hover,nav a.active{color:#f5a623}
main{width:90%;max-width:1100px;margin:34px auto;min-height:65vh}
h1{margin:0 0 12px}
h2{margin:0 0 18px;font-size:21px}
p{color:#a9b1bd}
.panel,.stat,.match{background:#111720;border:1px solid #29323e;border-radius:12px;padding:22px}
.search{display:flex;gap:10px;margin-bottom:18px}
.search input{flex:1;min-width:0;background:#151c25;color:white;border:1px solid #344052;border-radius:8px;padding:14px;font-size:16px}
button{background:#f5a623;color:#111;border:0;border-radius:8px;padding:13px 22px;font-weight:700;cursor:pointer}
button:hover{background:#ffbc4e}
.suggestions{margin:-10px 0 20px;display:none;max-height:240px;overflow:auto;background:#151c25;border-radius:8px}
.suggestions a{display:block;padding:10px 15px;border-bottom:1px solid #29323e}
.nick{display:inline-block;color:#d3d9e2;text-decoration:none;font-weight:650;transition:transform .2s,color .2s,text-shadow .2s;transform-origin:left center}
.nick:hover,.nick:focus-visible{color:#fff;transform:scale(1.08);text-shadow:0 0 12px #f5a623}
.profile{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.avatar{width:72px;height:72px;border-radius:50%;background:#f5a623;color:#111;display:grid;place-items:center;font-size:29px;font-weight:800;flex-shrink:0}
.profile h1 .nick{color:#fff}
.profile h1{margin:0}
.profile p{margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat small{color:#a9b1bd}
.stat strong{display:block;font-size:29px;margin-top:10px}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.map{margin:15px 0}
.map-line{display:flex;justify-content:space-between;margin-bottom:8px}
.track{background:#29323e;height:9px;border-radius:10px;overflow:hidden}
.fill{background:#f5a623;height:100%}
.graph{display:flex;align-items:end;gap:9px;height:160px}
.graph div{background:#f5a623;flex:1;border-radius:4px 4px 0 0}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.player-grid a{background:#151c25;padding:14px;border-radius:8px}
.matches{display:grid;gap:15px}
.match-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px;color:#f5a623}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center}
.team{display:grid;gap:9px}
.team:last-child{text-align:right}
.team:last-child .nick{transform-origin:right center}
.score{font-size:25px;font-weight:800;white-space:nowrap}
.hint{font-size:14px;color:#9da8b5;margin-bottom:24px}
footer{text-align:center;padding:30px;color:#8792a0;border-top:1px solid #29323e}
@media(max-width:650px){
.stats{grid-template-columns:1fr 1fr}
.columns{grid-template-columns:1fr}
.panel,.stat,.match{padding:15px}
.teams{gap:8px}
.score{font-size:18px}
.team{font-size:13px}
.search{flex-wrap:wrap}
.search button{width:100%}
}
</style>
</head>
<body>
<header>
<a class="logo" href="#home">CS<span>2</span> Stats</a>
<nav>
<a href="#home">Головна</a>
<a href="#players">Гравці</a>
<a href="#matches">Матчі</a>
</nav>
</header>
<main id="app"></main>
<footer>CS2 Stats © 2026 · Демонстраційні дані, не офіційна статистика CS2</footer>
<script>
const names = "s1mple,ZywOo,NiKo,donk,m0NESY,device,ropz,frozen,broky,Twistzz,electroNic,b1t,w0nderful,jL,NertZ,EliGE,stavn,jabbi,cadiaN,KSCERATO,yuurih,HObbit,Ax1Le,sh1ro,chopper,magixx,Boombl4,Perfecto,rain,XANTARES,apEX,flameZ,Spinx,mezii,dupreeh,Magisk,Snappi,SunPayus,maden,TeSeS,sjuush,kyxsan,degster,zont1x,torzsi,xertioN,Jimpphat,Brollan,siuhy,NAF,YEKINDAR,ultimate,skullz,ins,chelo,arT,FalleN,exit,malbsMd,huNter-,nexa,HooXi,Snax,TaZ,REZ,alex,headtr1ck,r1nkle,k0nfig,blameF,Staehr,br0,Buzz,es3tag,Altekz,acoR,KRIMZ,bodyy,afro,MATYS,sl3nd,Grim,floppy,hallzerk,JT,FaNg,autimatic,Stewie2K,HexT,CeRq,neaLaN,shalfey,ICY,FL1T,n0rb3r7,fame,Jame,FL4MUS,mir,interz".split(",");
const maps = ["Mirage","Dust II","Inferno","Ancient","Nuke","Anubis","Vertigo"];

const players = names.map((name,i)=>{
 const deaths=4500+(i*317%4200),kills=Math.round(deaths*(0.95+(i*13%48)/100));
 return {name,deaths,kills,kd:(kills/deaths).toFixed(2),winrate:48+(i*7%19)};
});

function shuffle(list,seed){
 const a=[...list];let x=seed;
 for(let i=a.length-1;i>0;i--){
  x=(x*1664525+1013904223)>>>0;
  const j=x%(i+1);
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

const matches=Array.from({length:30},(_,i)=>{
 const ten=shuffle(names,i+2026).slice(0,10);
 const a=13,b=i%5===0?13:5+(i*7%8);
 return {map:maps[i%maps.length],left:ten.slice(0,5),right:ten.slice(5),score:i%5===0?"16 : 14":`${a} : ${b}`};
});

const app=document.querySelector("#app");
const nick=name=>`<a class="nick" href="#player/${encodeURIComponent(name)}">${name}</a>`;

function profile(name){
 const p=players.find(x=>x.name.toLowerCase()===name.toLowerCase())||players[0];
 const bars=["Mirage","Dust II","Inferno","Ancient"].map((m,i)=>{
  const value=42+((names.indexOf(p.name)*17+i*11)%36);
  return `<div class="map"><div class="map-line"><span>${m}</span><span class="accent">${value}%</span></div><div class="track"><div class="fill" style="width:${value}%"></div></div></div>`;
 }).join("");
 const graph=Array.from({length:7},(_,i)=>`<div style="height:${30+(names.indexOf(p.name)*7+i*19)%65}%"></div>`).join("");

 app.innerHTML=`<div class="search"><input id="search" placeholder="Введіть нікнейм гравця..." autocomplete="off"><button id="find">Знайти</button></div>
 <div class="suggestions" id="suggestions"></div>
 <section class="panel profile"><div class="avatar">${p.name[0].toUpperCase()}</div><div><h1>${nick(p.name)}</h1><p>Counter-Strike 2 Player</p></div></section>
 <section class="stats"><div class="stat"><small>K/D Ratio</small><strong>${p.kd}</strong></div><div class="stat"><small>Kills</small><strong>${p.kills.toLocaleString("uk-UA")}</strong></div><div class="stat"><small>Deaths</small><strong>${p.deaths.toLocaleString("uk-UA")}</strong></div><div class="stat"><small>Win Rate</small><strong>${p.winrate}%</strong></div></section>
 <div class="columns"><section class="panel"><h2>Статистика карт</h2>${bars}</section><section class="panel"><h2>Останні матчі</h2><div class="graph">${graph}</div><p class="hint">Демонстраційний графік</p></section></div>`;

 const input=document.querySelector("#search"),results=document.querySelector("#suggestions");
 const find=()=>{
  const q=input.value.trim();
  const match=players.find(x=>x.name.toLowerCase()===q.toLowerCase());
  if(match)location.hash="player/"+encodeURIComponent(match.name);
  else alert("Гравця не знайдено");
 };
 document.querySelector("#find").onclick=find;
 input.onkeydown=e=>{if(e.key==="Enter")find()};
 input.oninput=()=>{
  const q=input.value.trim().toLowerCase();
  const found=q?players.filter(x=>x.name.toLowerCase().includes(q)).slice(0,12):[];
  results.innerHTML=found.map(x=>nick(x.name)).join("");
  results.style.display=found.length?"block":"none";
 };
}

function listPlayers(){
 app.innerHTML=`<h1>Гравці <span class="accent">(100)</span></h1><p class="hint">Натисни на нікнейм, щоб відкрити статистику гравця.</p><div class="player-grid">${players.map(p=>nick(p.name)).join("")}</div>`;
}

function listMatches(){
 app.innerHTML=`<h1>Матчі <span class="accent">(30)</span></h1><p class="hint">Демонстраційні матчі: випадкові склади по 5 гравців, без назв команд. Натисни на нікнейм, щоб переглянути статистику.</p>
 <div class="matches">${matches.map((m,i)=>`<section class="match"><div class="match-top"><strong>Матч #${i+1}</strong><span>${m.map}</span></div><div class="teams"><div class="team">${m.left.map(nick).join("")}</div><div class="score">${m.score}</div><div class="team">${m.right.map(nick).join("")}</div></div></section>`).join("")}</div>`;
}

function render(){
 const route=decodeURIComponent(location.hash.slice(1));
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===(route.startsWith("player/")?"#home":"#"+(route||"home"))));
 if(route==="players")listPlayers();
 else if(route==="matches")listMatches();
 else profile(route.startsWith("player/")?route.slice(7):"s1mple");
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
